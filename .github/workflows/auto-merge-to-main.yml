name: Claude 브랜치 → main 자동 병합

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git 사용자 설정
        run: |
          git config user.name "AIASF AutoSync"
          git config user.email "autosync@aiasf.bot"

      - name: main 브랜치로 자동 병합
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "📥 병합 시작: $BRANCH → main"
          git checkout main
          git merge --no-ff "$BRANCH" -m "자동 병합: $BRANCH → main ($(date '+%Y-%m-%d %H:%M'))"
          git push origin main
          echo "✅ 자동 병합 완료 → main 최신화됨"

      - name: 결과 요약
        run: |
          echo "=== 동기화 완료 ==="
          echo "브랜치: ${{ github.ref_name }} → main"
          echo "시각: $(date '+%Y-%m-%d %H:%M:%S')"
          git log --oneline -3
