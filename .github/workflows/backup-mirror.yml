name: Backup Mirror to OAACEO-backup

on:
  workflow_run:
    workflows: ["Claude 브랜치 -> main 자동 병합"] 
    types:
      - completed
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          # 👇 바로 이 한 줄이 핵심 키맨입니다 👇
          # 처음 레포를 가져올 때부터 마스터 토큰을 적용하여 덮어쓰기 방지
          token: ${{ secrets.BACKUP_REPO_PAT }}

      - name: Push to Backup Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 이미 Git이 PAT 토큰을 들고 있으므로 순수 URL로만 푸시하면 끝!
          git remote add backup https://github.com/rhtpgud3028-sudo/OAACEO-backup.git
          git push backup main --force
